name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  rust:
    name: Rust (cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: rust-toolchain.toml pins the version and components,
      # and rustup installs it on the first cargo call. One source of truth.
      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
