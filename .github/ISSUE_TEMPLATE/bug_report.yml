name: Bug report
description: Something is broken or behaves unexpectedly
title: "fix: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Repo docs and issues are in **English**.
        For security vulnerabilities, see [SECURITY.md](https://github.com/MarcosLorejan/converte-facil/blob/main/SECURITY.md) (use private reporting).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps if possible.
      placeholder: |
        1. Open …
        2. Choose …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      description: Release tag or `git rev-parse --short HEAD`
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 10
        - Windows 11
        - Other
    validations:
      required: false
  - type: checkboxes
    id: ui-language
    attributes:
      label: UI language (if relevant)
      options:
        - label: English
        - label: Portuguese (pt-BR)
